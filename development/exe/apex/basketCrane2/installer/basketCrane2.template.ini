; Installation template: replace placeholders before connecting to the plant.
; Administrator-managed configuration; retained during upgrade and uninstall.
[Environment]
Mode=LiveObserver
[Plc]
Crane2Ip=127.0.0.1
OldOvenIp=127.0.0.1
NewOvenIp=127.0.0.1
PollIntervalMs=1000
HandshakeTimeoutMs=5000
[BasketDatabase]
Server=CHANGE_ME_SQL_SERVER
Encrypt=Mandatory
TrustServerCertificate=false
User=CHANGE_ME
Password=CHANGE_ME
Catalog=CHANGE_ME
[EpicsDatabase]
Server=CHANGE_ME_SQL_SERVER
Encrypt=Mandatory
TrustServerCertificate=false
User=CHANGE_ME
Password=CHANGE_ME
Catalog=CHANGE_ME
[Epics2Database]
Server=CHANGE_ME_SQL_SERVER
Encrypt=Mandatory
TrustServerCertificate=false
User=CHANGE_ME
Password=CHANGE_ME
Catalog=CHANGE_ME
[Access]
WeakPassword=CHANGE_ME
StrongPassword=CHANGE_ME
[Timers]
MainMs=1000
PositionsMs=1000
ConveyorsMs=1000
CarriageStatusMs=1000
MissionsMs=1000
ExportQueueMs=1000
[Logging]
RetainedRows=10000

; Error notifications use the configured SMTP relay. Restart after editing.
[EmailAlerts]
EnableErrorEmailNotification=true
ErrorEmailIntervalMinutes=60
SmtpHost=vitrum-ca.mail.protection.outlook.com
SmtpPort=25
SmtpEnableSsl=false
SmtpFrom=BasketCrane2Application@lorvalcapital.ca
SmtpTo="lcmit@lorvalcapital.atlassian.net"
SmtpSubjectPrefix="[Basket Crane 2 Error] : "
; Optional authenticated SMTP (requires SmtpEnableSsl=true).
SmtpUsername=
SmtpPassword=CHANGE_ME
SmtpTimeoutSeconds=20
